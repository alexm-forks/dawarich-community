name: alex-hack build (gms APK → GitHub Release)

# Personal builds of the alex-hack branch. Each run publishes a signed APK as the
# latest GitHub Release, which Obtainium on the phone picks up.
# Setup notes live outside this repo (dawarich/HACKS.md in the sandbox repo).

on:
  push:
    branches: [ alex-hack ]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
      - "android/**"
      - "assets/**"
      - ".github/workflows/alex-build.yml"
  workflow_dispatch:

concurrency:
  group: alex-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "21"
      NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (from .flutter-version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write android/local.properties
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          FLUTTER_SDK="${FLUTTER_HOME:-$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")}"
          {
            echo "sdk.dir=${SDK_DIR}"
            echo "flutter.sdk=${FLUTTER_SDK}"
          } > android/local.properties

      - name: Cache NDK and CMake
        uses: actions/cache@v4
        id: cache-ndk-cmake
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-${{ env.NDK_VERSION }}-cmake-3.22.1-v1

      - name: Install NDK and CMake (if not cached)
        if: steps.cache-ndk-cmake.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: Pin NDK version and turn on alex-hack identity
        shell: bash
        run: |
          set -euo pipefail
          GP=android/gradle.properties
          sed -i '/^android\.ndkVersion=/d; /^alexHack=/d' "$GP"
          printf '\nandroid.ndkVersion=%s\nalexHack=%s\n' "$NDK_VERSION" "${{ github.run_number }}" >> "$GP"

      - name: Check signing secrets are set
        env:
          KS: ${{ secrets.ALEX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ALEX_KEYSTORE_BASE64 secret is missing - see dawarich/HACKS.md in the sandbox repo"
            exit 1
          fi

      - name: Decode keystore
        env:
          KS: ${{ secrets.ALEX_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/alex-hack.jks

      - name: Create keystore.properties
        env:
          STORE_PW: ${{ secrets.ALEX_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ALEX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALEX_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=../alex-hack.jks"
          } > android/keystore.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build GMS APK (release)
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          APP_VERSION="${APP_VERSION%%+*}"
          # versionCode: minutes since 1970, always increasing and well under Android's limit.
          BUILD_NUMBER=$(( $(date +%s) / 60 ))
          flutter build apk --release --flavor gms \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Read version from the APK
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT2=$(ls "$SDK_DIR"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-gms-release.apk
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | head -1
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          PACKAGE=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = "uk.a09.dawarich" || { echo "::error::unexpected package $PACKAGE"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/dawarich-alex-${VERSION_NAME}.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag is exactly the app's versionName so Obtainium can compare versions.
          # No leading "v", so upstream's release-on-tag.yml (v*) never matches.
          tag_name: ${{ steps.ver.outputs.version_name }}
          name: ${{ steps.ver.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            alex-hack build of ${{ github.sha }}.
            Changes: https://github.com/${{ github.repository }}/compare/main...${{ github.sha }}
